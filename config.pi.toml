# AcePoint 树莓派 4 实机配置
#   视频源：两个 USB 摄像头（ls /dev/video* 确认设备号，一般是 0 和 2）
#   显示：MAX7219 8x32 点阵屏（需先 raspi-config 开启 SPI）
# 阶段1 只接一个摄像头时，把下面 right 那段 [[sources]] 注释掉即可

[recognition]
model_path = "models/gesture_recognizer.task"
min_confidence = 0.6
min_hand_detection_confidence = 0.5
num_hands = 2
per_source_recognizer = true          # 每路一个实例。需求 §6 原本写的是共用一个省内存，
                                      # 但实测双路交替喂帧时，VIDEO 模式的手部跟踪状态会
                                      # 互相污染：Thumb_Down 检出率掉 77%，整体只有 88% 一致。
                                      # 代价是多约 70MB（283MB -> 352MB），2GB 的 Pi 吃得下。
parallel = true                       # 左右两路各占一个线程同时识别。Pi 4 实测单帧识别
                                      # 157~219ms（推理是单线程的），左右轮流跑每路只有
                                      # 2.5fps，而下面的防误触参数是按 5fps/路 标定的：
                                      # 0.6 秒的手势触发率从 100% 掉到 50%。
inference_threads = 2                 # 每个识别器的推理线程数（MediaPipe 默认 1）。Pi 4 实测
                                      # 画面里有手时单帧 297ms -> 185ms，结果完全相同。
                                      # 4 个核只够每路 2 个：配 3 两路同时跑反而更慢，配 4 慢 6 倍

[capture]
poll_hz = 10
decode_on_demand = true               # 只解码真正要用的帧。相机出 30fps、每路只用 5fps，
                                      # 两路 1080p MJPEG 全解码在 Pi 4 上白占一个多核。
                                      # 相机表现异常（某半场离线、帧率掉到 1~2）就改回 false
width = 1920                          # 必须是摄像头支持的 MJPEG 分辨率
height = 1080
crop_w_ratio = 0.5                    # 识别区：画面中央 50% x 50%，等于把画面拉近一倍
crop_h_ratio = 0.5                    # （2026-11 球场实测后改，原来是 0.6 x 0.8，距离不够）。
                                      # 长边 1152px -> 960px，同样大小的手能认到的距离约 1.2 倍；
                                      # 还不够远就继续收（0.33 = 拉近三倍），代价是站位要更准
crop_cx_ratio = 0.5                   # 识别区中心，0.5/0.5 = 画面正中
crop_cy_ratio = 0.5
# 上面四个值**必须上机后重标**，尤其是中心。开发用的 config.toml 已经不是居中了：
# 真实球场素材里球员把手举到头旁边，13 次真手势的重心比画面中心高 177px，
# 居中裁只认出 1/13，把中心挪上去认出 9/13（长边不变）。网柱机位同理 ——
# 相机装在网高(约 1.55m)、球员举手在 2m 上下，手势也会偏在画面上半部。
# 标定办法：录一段真实比划，跑 scripts/compare_roi.py --ratios 扫中心和大小。

[scoring]
hold_seconds = 0.25                   # 加分(Victory/Pointing_Up) / 撤销(Thumb_Down) 保持时长。
                                      # 2026-11 球场实测嫌慢，由 0.5 减半。相位扫描：实机 3.8~5fps 下
                                      # 触发率和 0.5 时完全一样（卡的是 hold_min_samples，不是时长），
                                      # ≤0.2 秒的闪现仍是 0%，手势出现到计分从约 0.7 秒降到 0.4~0.6 秒
hold_grace_seconds = 0.4              # 保持期间容忍手势丢检多久(约 2 个采样点)
hold_min_samples = 2                  # 必须真正识别到几次才算数(防单次闪现误触)。
                                      # 球馆实测误加分偏多的话优先调高这个，而不是调 hold_seconds
                                      # 这两个值由手持竖屏素材标定，上机后需用真实网前
                                      # 横屏素材重新验证(需求 §10 阶段2)
reset_hold_seconds = 0.5              # 清零(Open_Palm)保持时长。2026-11 按用户要求 3.0 -> 0.5。
                                      # 清零会把双方都归零、不能用手势撤销，而张开手掌是很常见的
                                      # 动作：球场上误清零多就调回 1.5
cooldown_seconds = 2.0                # 计分后该半场冷却。2026-11 由 5.0 改 3.0 再改 2.0：实测同一人
                                      # 连续计分时第二次举手常被冷却挡掉。下限约束：手一直举着
                                      # 超过 冷却 + 约 0.3 秒 就会再加一分，球场上出现一次举手
                                      # 加两分就调回 3.0

[game]
enabled = true                        # 关掉就是纯计分器，不判胜负
target = 21
win_by = 2
cap = 30                              # 29:29 后先到 30 者直接获胜
# 分出胜负后点阵屏在比分和 "L WIN"/"R WIN" 之间每 2 秒轮换，
# 本局冻结（加分忽略、撤销可用），张开手掌 0.5 秒开下一局

[display]
backends = ["led", "console"]         # 想在手机上远程看比分就加 "web"

[display.web]
host = "0.0.0.0"
port = 8080
preview = false                       # Pi 上开预览会明显吃 CPU
allow_manual = true

[display.led]
brightness = 72                       # 0~255，越高越费电。MAX7219 实际只有 16 档（每 16 一档）：
                                      # 72 = 第 4 档；原来的 60 是第 3 档，实机看着偏暗
cascaded = 4                          # 4 块 8x8：左右各两块，每边两位数字
block_orientation = -90               # 显示乱码/倒置就调这个（0 / 90 / -90 / 180）
rotate = 0
reverse_blocks = false                # 左右装反了就改 true（取决于级联接线方向）
show_match_point = true               # 赛点时在该侧底部画一条下划线
show_hold_progress = true             # 识别条：底部一条实线，一认出手势就亮，从该方外侧边缘
                                      # 向对面变长，涨满即计分 —— 不看网页时唯一的即时反馈
show_cooldown = true                  # 冷却条：计分后底部一条虚线，缩完才能再比手势
bus_speed_hz = 500000                 # 实机实测：8MHz 下四块屏时亮时灭，0.5MHz 稳定。
                                      # 根因是 3.3V 电平余量不足（见 deploy/README.md），
                                      # 加了电平转换后可以再往上调
spi_port = 0
spi_device = 0
# 接好线先跑 acepoint --led-test -c config.pi.toml 标定方向
# 布局：左半场两位数字占 0~15px，右半场占 16~31px，没有冒号的位置。
# 分出胜负时获胜方的两位数字闪烁（塞不下 "WIN" 文字），另一侧保持常亮。

# device 可以写设备号，但编号重启后可能变、左右会静默对调。装盒前改成稳定路径：
#   ls -l /dev/v4l/by-id/   然后写成  device = "/dev/v4l/by-id/usb-..._<序列号>-video-index0"
# 详见 deploy/README.md 第 4 节
[[sources]]
side = "left"
kind = "camera"
device = 0
mirror = false

[[sources]]
side = "right"
kind = "camera"
device = 2
mirror = false

[record]
# 边计分边录像 + 计分日志，实测和标定期间开着，正式使用时关掉省 CPU 和 SD 卡。
# 每次开机在 recordings/<日期_时间>/ 下生成：left_000.mkv ...（识别用的那一帧，
# 整帧不裁、对齐挂钟，可直接喂 scripts/ 下的分析工具）、events.csv（每路每拍一行：
# 认到什么、置信度、计时/冷却、加分）、acepoint.log（程序日志，journald 重启就没）。
# 注意：只读文件系统开着时写进的是内存，重启即丢，而且会把内存写满 —— 录像期间关只读。
enabled = true
dir = "recordings"
video = true
jpeg_quality = 85
segment_minutes = 10                  # 分段，热拔电最多坏掉最后一段
min_free_gb = 2.0                     # SD 卡剩余低于此值停止录像，日志照记

[audio]
# 安装 pip install -e ".[audio]"，运行 acepoint --audio-test 试听后开启。
enabled = false
backend = "pygame"
pack_root = "audio"
style = "friends"
mode = "balanced"
volume = 0.6
muted = false
allow_web_control = true
